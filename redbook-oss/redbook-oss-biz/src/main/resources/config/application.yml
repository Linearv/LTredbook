server:
  port: 8081 # 项目启动的端口

spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境


storage:
  type: minio # 对象存储类型

############## Knife4j / SpringDoc 配置 ##############
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 对象存储服务 API
    description: 小红书 OSS 服务 - 文件上传、下载等