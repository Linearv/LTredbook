server:
  port: 8092 # 项目启动的端口

spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境

############## Knife4j / SpringDoc 配置 ##############
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: 搜索服务 API
    description: 小红书搜索服务 - 用户搜索等