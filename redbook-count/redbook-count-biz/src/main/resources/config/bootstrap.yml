spring:
  application:
    name: redbook-count # 应用名称
  profiles:
    active: dev # 默认激活 dev 本地开发环境
  cloud:
    nacos:
      config:
        server-addr: http://127.0.0.1:8848 # 指定 Nacos 配置中心的服务器地址
        prefix: ${spring.application.name} # 配置 Data Id 前缀，这里使用应用名称作为前缀
        group: DEFAULT_GROUP # 所属组
        namespace: redbook # 命名空间
        file-extension: yaml # 配置文件格式
        refresh-enabled: true # 是否开启动态刷新
      discovery:
        enabled: true # 启用服务发现
        group: DEFAULT_GROUP # 所属组
        namespace: redbook # 命名空间
        server-addr: 127.0.0.1:8848 # 指定 Nacos 配置中心的服务器地址
    sentinel:
      eager: true # 启动时立即加载规则，无需等待首次请求
      transport:
        port: 8721 # Sentinel Server 端口（同机多服务需唯一，避免与 user 的 8719、kv 的 8720 冲突）
        dashboard: 127.0.0.1:8060 # Sentinel 控制台端口
      datasource:
        flow: # 限流规则
          nacos: # 数据源类型为 Nacos（Sentinel 规则存储和动态配置）
            serverAddr: http://127.0.0.1:8848 # Nacos 服务器地址
            namespace: redbook # 命名空间
            groupId: DEFAULT_GROUP # 所属组
            dataId: sentinel-count-flow # 限流规则 Data ID
            ruleType: flow # 规则类型（flow 表示限流规则）
        degrade: # 熔断规则
          nacos:
            serverAddr: http://127.0.0.1:8848
            namespace: redbook
            groupId: DEFAULT_GROUP
            dataId: sentinel-count-degrade # 熔断规则 Data ID
            ruleType: degrade # 规则类型（degrade 表示熔断规则）


