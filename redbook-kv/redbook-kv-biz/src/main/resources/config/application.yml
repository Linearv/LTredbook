server:
  port: 8084 # 项目启动的端口

spring:
  profiles:
    active: dev # 默认激活 dev 本地开发环境


mybatis:
  # MyBatis xml 配置文件路径
  mapper-locations: classpath:/mapper/**/*.xml


############## Knife4j / SpringDoc 配置 ##############
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn
  openapi:
    title: KV 存储服务 API
    description: 小红书 KV 存储服务 - 笔记/评论内容存储等